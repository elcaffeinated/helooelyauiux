<!doctype html>
<html lang="<!-- figma:lang -->">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><!-- figma:title --></title>
    <meta name="description" content="Junior web developer with a UI/UX design edge, based in the Philippines. Open to internships and freelance." />
    <meta property="og:title" content="elya — Junior Web Developer with a UI/UX Design Edge" />
    <meta property="og:image" content="/assets/og.jpg" />
    <meta name="theme-color" content="#000000" />
    <script>
      document.documentElement.classList.add('js')
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.classList.add('light')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f8f6fc')
        }
      } catch (e) {}
    </script>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
